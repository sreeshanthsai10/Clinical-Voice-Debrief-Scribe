<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clinical Voice Debrief | Scribe</title>
  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --heading: #f0f6fc;
      --accent: #238636;
      --accent-hover: #2ea043;
      --secondary: #21262d;
      --secondary-hover: #30363d;
      --danger: #da3633;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      background: var(--bg);
      color: var(--text);
      max-width: 820px;
      margin: 40px auto;
      padding: 0 20px;
    }
    h1 { color: var(--heading); font-size: 1.4rem; margin-bottom: 6px; }
    p.subtitle { color: #8b949e; font-size: 0.9rem; margin-top: 0; }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 20px;
      margin-top: 18px;
    }
    .controls { display: flex; gap: 12px; align-items: center; }
    button {
      font-family: inherit;
      background: var(--accent);
      color: #ffffff;
      border: none;
      padding: 9px 16px;
      font-size: 0.88rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.15s ease;
    }
    button:hover:not(:disabled) { background: var(--accent-hover); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button.recording { background: var(--danger); }
    button.btn-secondary {
      background: var(--secondary);
      border: 1px solid var(--border);
      color: var(--heading);
    }
    button.btn-secondary:hover:not(:disabled) {
      background: var(--secondary-hover);
    }
    .action-bar {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-bottom: 12px;
    }
    #status { font-size: 0.85rem; color: #8b949e; }
    .section-title {
      color: var(--heading);
      font-size: 0.9rem;
      margin-top: 14px;
      margin-bottom: 4px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .text-content {
      background: #090d13;
      border: 1px solid var(--border);
      padding: 10px 12px;
      border-radius: 4px;
      font-size: 0.9rem;
      white-space: pre-wrap;
      line-height: 1.5;
    }
    pre {
      background: #090d13;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 14px;
      font-size: 0.82rem;
      overflow-x: auto;
      color: #58a6ff;
    }

    /* Print-ready document styles */
    @media print {
      body {
        background: #ffffff !important;
        color: #000000 !important;
        max-width: 100% !important;
        margin: 0 !important;
        padding: 20px !important;
        font-size: 11pt;
      }
      .no-print, .controls, .action-bar, pre, #status, h1, p.subtitle {
        display: none !important;
      }
      .card {
        background: transparent !important;
        border: none !important;
        padding: 0 !important;
        margin: 0 !important;
      }
      .print-header {
        display: block !important;
        border-bottom: 2px solid #000000;
        margin-bottom: 15px;
        padding-bottom: 6px;
      }
      .section-title {
        color: #000000 !important;
        font-size: 10pt;
        border-bottom: 1px solid #ccc;
        margin-top: 16px;
        padding-bottom: 2px;
      }
      .text-content {
        background: transparent !important;
        border: none !important;
        padding: 4px 0 !important;
        font-size: 10.5pt;
        color: #000000 !important;
      }
    }
    .print-header { display: none; }
  </style>
</head>
<body>

  <h1 class="no-print">Clinical Voice Debrief Scribe</h1>
  <p class="subtitle no-print">Whisper Large v3 Turbo + Llama Extraction Pipeline</p>

  <div class="card no-print">
    <div class="controls">
      <button id="recordBtn">Record Debrief</button>
      <span id="status">Ready to record.</span>
    </div>
  </div>

  <div id="resultContainer" class="card" style="display: none;">
    
    <!-- Printable header visible only in print preview -->
    <div class="print-header">
      <h2 style="margin: 0; font-size: 14pt;">Clinical Encounter Note (SOAP)</h2>
      <small id="printTimestamp" style="color: #555;"></small>
    </div>

    <!-- Action Bar for Copy & Export -->
    <div class="action-bar no-print">
      <button id="copyBtn" class="btn-secondary">📋 Copy Note</button>
      <button id="printBtn" class="btn-secondary">🖨️ Print / Save PDF</button>
    </div>

    <div class="section-title">Patient / Demographic</div>
    <div id="patientField" class="text-content"></div>

    <div class="section-title">Subjective (S)</div>
    <div id="subjectiveField" class="text-content"></div>

    <div class="section-title">Objective (O)</div>
    <div id="objectiveField" class="text-content"></div>

    <div class="section-title">Assessment (A)</div>
    <div id="assessmentField" class="text-content"></div>

    <div class="section-title">Plan (P)</div>
    <div id="planField" class="text-content"></div>

    <div class="no-print">
      <div class="section-title" style="margin-top: 20px;">Raw Validated JSON</div>
      <pre><code id="jsonOutput"></code></pre>
    </div>
  </div>

  <script>
    let mediaRecorder;
    let audioChunks = [];
    let currentNoteData = null;

    const recordBtn = document.getElementById('recordBtn');
    const copyBtn = document.getElementById('copyBtn');
    const printBtn = document.getElementById('printBtn');
    const statusLabel = document.getElementById('status');
    const resultContainer = document.getElementById('resultContainer');

    recordBtn.addEventListener('click', async () => {
      if (!mediaRecorder || mediaRecorder.state === 'inactive') {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });
          audioChunks = [];

          mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
          mediaRecorder.onstop = uploadAudio;

          mediaRecorder.start();
          recordBtn.textContent = 'Stop & Process Note';
          recordBtn.classList.add('recording');
          statusLabel.textContent = 'Recording active... Dictate summary.';
        } catch (err) {
          alert('Microphone access denied: ' + err.message);
        }
      } else {
        mediaRecorder.stop();
        mediaRecorder.stream.getTracks().forEach(t => t.stop());
        recordBtn.textContent = 'Processing...';
        recordBtn.disabled = true;
        recordBtn.classList.remove('recording');
        statusLabel.textContent = 'Transcribing and structuring via Groq...';
      }
    });

    async function uploadAudio() {
      const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
      const formData = new FormData();
      formData.append('file', audioBlob, 'debrief.webm');

      try {
        const res = await fetch('/process-voice-debrief', {
          method: 'POST',
          body: formData
        });

        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.detail || 'Processing failed');
        }

        currentNoteData = await res.json();
        renderResult(currentNoteData);
        statusLabel.textContent = 'Completed successfully.';
      } catch (err) {
        statusLabel.textContent = 'Error: ' + err.message;
      } finally {
        recordBtn.disabled = false;
        recordBtn.textContent = 'Record Debrief';
      }
    }

    function renderResult(data) {
      resultContainer.style.display = 'block';
      document.getElementById('patientField').textContent = data.patient_identifier || 'None specified';
      document.getElementById('subjectiveField').textContent = data.subjective;
      document.getElementById('objectiveField').textContent = data.objective;
      document.getElementById('assessmentField').textContent = data.assessment;

      let planText = 'Instructions:\n' + (data.plan_instructions.map(i => '• ' + i).join('\n') || 'None');
      if (data.plan_medications && data.plan_medications.length > 0) {
        planText += '\n\nMedications:\n' + data.plan_medications.map(m => 
          `• ${m.name} | Dose: ${m.dosage || 'N/A'} | Freq: ${m.frequency || 'N/A'} | Dur: ${m.duration || 'N/A'}`
        ).join('\n');
      }
      document.getElementById('planField').innerText = planText;
      document.getElementById('jsonOutput').textContent = JSON.stringify(data, null, 2);

      document.getElementById('printTimestamp').textContent = 'Generated: ' + new Date().toLocaleString();
    }

    // Copy formatted plain text to clipboard
    copyBtn.addEventListener('click', async () => {
      if (!currentNoteData) return;

      const formatted = [
        `PATIENT / DEMOGRAPHIC: ${currentNoteData.patient_identifier || 'N/A'}`,
        `\n[SUBJECTIVE]\n${currentNoteData.subjective}`,
        `\n[OBJECTIVE]\n${currentNoteData.objective}`,
        `\n[ASSESSMENT]\n${currentNoteData.assessment}`,
        `\n[PLAN]\nInstructions:`,
        currentNoteData.plan_instructions.map(i => ` - ${i}`).join('\n') || ' - None',
        currentNoteData.plan_medications.length > 0 ? '\nMedications:' : '',
        currentNoteData.plan_medications.map(m => 
          ` - ${m.name}: ${m.dosage || ''} ${m.frequency || ''} (${m.duration || ''})`.trim()
        ).join('\n')
      ].filter(Boolean).join('\n');

      try {
        await navigator.clipboard.writeText(formatted);
        const originalText = copyBtn.textContent;
        copyBtn.textContent = '✅ Copied!';
        setTimeout(() => { copyBtn.textContent = originalText; }, 2000);
      } catch (err) {
        alert('Failed to copy to clipboard: ' + err.message);
      }
    });

    // Trigger browser print dialog (Users can select "Save as PDF")
    printBtn.addEventListener('click', () => {
      window.print();
    });
  </script>
</body>
</html>
